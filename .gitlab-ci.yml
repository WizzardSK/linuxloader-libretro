# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)
#
# The core is a 64-bit libretro library that carries the loader, a 32-bit
# program, as a zip and writes it into system/linuxloader/ at load. Each job
# builds both: the loader, zipped, and the core around that zip.
#
# Windows: the loader with MXE's i686 compiler and the core with its x86_64
# one, both in the image the template names.
#
# Linux: the loader is a 32-bit program shipped as an AppDir with its i386
# libraries and Kisak's Mesa, which none of the buildbot's images have; it is
# built once in Ubuntu 22.04 (as the GitHub workflow builds it, with the same
# scripts) by linux-loader, which the x86_64 and aarch64 cores both take.
# aarch64 runs that loader through FEX-Emu, with an i386 root file system
# (scripts/fex/fetch-fex.py, from FEX's PPA and Ubuntu 22.04).

##############################################################################
################################# BOILERPLATE ################################
##############################################################################

variables:
  GIT_SUBMODULE_STRATEGY: none

.core-defs:
  variables:
    CORENAME: linuxloader

include:
  # Linux
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-x64.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-aarch64.yml'

  # Windows
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-x64-mingw.yml'

stages:
  - build-prepare
  - build-shared

default:
  retry: 2

##############################################################################
#################################### STAGES ##################################
##############################################################################

# Windows 64-bit
libretro-build-windows-x64:
  extends:
    - .libretro-windows-x64-mingw-make-default
    - .core-defs
  variables:
    # the loader's compiler (mingw32.cmake); the core's is the template's CC
    MINGW32_PREFIX: i686-w64-mingw32.static
  script:
    # the loader
    - make win32 -j${NUMPROC}
    - mkdir -p dist/system/linuxloader
    - cp build-win32/linuxloader.exe dist/system/linuxloader/
    - cp -r libs/win32/ll-deps dist/system/linuxloader/
    - git rev-parse --short HEAD > dist/system/linuxloader/build
    # zipped with Python, which the image has (it has no zip)
    - (cd dist/system/linuxloader && python3 -m zipfile -c "$CI_PROJECT_DIR/system.zip" *)
    # the core, carrying it
    - make -f Makefile.libretro platform=win64 SYSTEM_ZIP=system.zip BUILD_STAMP=$(git rev-parse --short HEAD) -j${NUMPROC}
    - cp build/${CORENAME}_libretro.dll .

# The packages the Linux jobs build with, in Ubuntu 22.04: the buildbot's
# Linux images are older and have no i386 multilib (scripts/appimage).
.linux-container:
  image: ubuntu:22.04
  before_script:
    - export NUMPROC=$(($(nproc)/5)); [ "$NUMPROC" -ge 1 ] || NUMPROC=1
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends sudo software-properties-common gpg-agent wget git file zip unzip ca-certificates build-essential cmake python3 >/dev/null

# The 32-bit Linux loader as an AppDir, for both Linux cores. Not a
# libretro-build job, so its artifact is not a core the buildbot ships.
linux-loader:
  extends: .linux-container
  stage: build-prepare
  timeout: 2h
  script:
    - scripts/appimage/install-packages.sh
    - scripts/appimage/id-libs.sh
    - scripts/appimage/install-kisak.sh
    - scripts/appimage/build-deps.sh
    - scripts/appimage/pack-libs.sh
    - make linux
    - scripts/appimage/make-appimage.sh
    # as a tarball, which keeps the programs' modes and the symlinks
    - tar -C build-linux/linuxloader.AppDir -czf loader.tar.gz .
  artifacts:
    paths:
      - loader.tar.gz
    expire_in: 1 day

# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .libretro-linux-x64-make-default
    - .core-defs
    - .linux-container
  needs:
    - linux-loader
  dependencies:
    - linux-loader
  script:
    - mkdir -p dist/system/linuxloader
    - tar -xzf loader.tar.gz -C dist/system/linuxloader
    - git rev-parse --short HEAD > dist/system/linuxloader/build
    - (cd dist/system/linuxloader && zip -q -r -y -9 "$CI_PROJECT_DIR/system.zip" .)
    - make -f Makefile.libretro SYSTEM_ZIP=system.zip BUILD_STAMP=$(git rev-parse --short HEAD) -j${NUMPROC}
    - cp build/${CORENAME}_libretro.so .

# Linux ARM 64-bit: the x86 loader through FEX-Emu
libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-aarch64-make-default
    - .core-defs
    - .linux-container
  needs:
    - linux-loader
  dependencies:
    - linux-loader
  timeout: 1h
  script:
    - mkdir -p dist/system/linuxloader
    - tar -xzf loader.tar.gz -C dist/system/linuxloader
    - python3 scripts/fex/fetch-fex.py dist/system/linuxloader
    - git rev-parse --short HEAD > dist/system/linuxloader/build
    - (cd dist/system/linuxloader && zip -q -r -y -9 "$CI_PROJECT_DIR/system.zip" .)
    - make -f Makefile.libretro SYSTEM_ZIP=system.zip BUILD_STAMP=$(git rev-parse --short HEAD) -j${NUMPROC}
    - cp build/${CORENAME}_libretro.so .
