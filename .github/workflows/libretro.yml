name: Libretro core

on:
  workflow_dispatch:
  push:
    branches:
      - libretro
    paths-ignore:
      - '**.md'

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/install-packages.sh') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      # The loader and its AppDir, as the project's own AppImage build makes
      # them: the core runs the game through that AppDir's AppRun
      # Ubuntu's own archive instead of Azure's mirror, which served some 50 KB/s
      # (NNshi), and a stalled fetch fails the step instead of the job's
      # whole 40 minutes
      - name: Install packages
        timeout-minutes: 25
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|' /etc/apt/apt-mirrors.txt
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80retries
          scripts/appimage/install-packages.sh
      - name: Pack ID libs
        run: scripts/appimage/id-libs.sh
      - name: Install Kisak
        run: scripts/appimage/install-kisak.sh
      - name: Build deps
        run: scripts/appimage/build-deps.sh
      - name: Pack libs
        run: scripts/appimage/pack-libs.sh
      - name: Loader and AppDir
        shell: bash
        run: |
          make linux
          scripts/appimage/make-appimage.sh

      # The core carries the loader's system/linuxloader as a zip and writes
      # it out at load; the archive still has it beside the core too
      - name: System zip
        shell: bash
        run: |
          mkdir -p dist/system/linuxloader
          cp -a build-linux/linuxloader.AppDir/. dist/system/linuxloader/
          git rev-parse --short HEAD > dist/system/linuxloader/build
          (cd dist/system/linuxloader && zip -q -r -y -9 "$GITHUB_WORKSPACE/system.zip" .)

      - name: Core
        run: CC=gcc make -f Makefile.libretro SYSTEM_ZIP=system.zip BUILD_STAMP=$(git rev-parse --short HEAD)

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/cores dist/info
          cp build/linuxloader_libretro.so dist/cores/
          strip dist/cores/linuxloader_libretro.so
          cp linuxloader_libretro.info dist/info/
          tar -czf linuxloader_libretro-linux-x86_64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: linuxloader_libretro-linux-x86_64
          path: linuxloader_libretro-linux-x86_64.tar.gz

  # The loader's Windows build (linuxloader.exe, which loads the game's ELF
  # itself), as the project's own Windows release makes it, and the 64-bit
  # core cross-compiled beside it
  windows-x86_64:
    name: Windows x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Only what the runner lacks (cmake, make and zip are on it), without
      # the script's apt upgrade of the whole runner, and from Ubuntu's own
      # archive instead of Azure's mirror, which served some 50 KB/s (NNshi).
      # A stalled fetch fails the step instead of the job's whole hour.
      - name: Install packages
        timeout-minutes: 25
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -y install --no-install-recommends mingw-w64 mingw-w64-i686-dev
      - name: Loader
        shell: bash
        run: scripts/windows/windows-build.sh
      - name: System zip
        shell: bash
        run: |
          mkdir -p dist/system/linuxloader
          cp -a win-release/. dist/system/linuxloader/
          git rev-parse --short HEAD > dist/system/linuxloader/build
          (cd dist/system/linuxloader && zip -q -r -9 "$GITHUB_WORKSPACE/system.zip" .)
      - name: Core
        run: make -f Makefile.libretro platform=win64 SYSTEM_ZIP=system.zip BUILD_STAMP=$(git rev-parse --short HEAD)
      - name: Package
        shell: bash
        run: |
          # the core and its info side by side, no folders: the artifact is
          # the one zip, and the core carries the loader (NNshi)
          mkdir -p pkg
          cp build/linuxloader_libretro.dll pkg/
          x86_64-w64-mingw32-strip pkg/linuxloader_libretro.dll
          cp linuxloader_libretro.info pkg/
      - uses: actions/upload-artifact@v4
        with:
          name: linuxloader_libretro-windows-x86_64
          path: pkg/

  linux-aarch64:
    name: Linux aarch64
    needs: [linux-x86_64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linuxloader_libretro-linux-x86_64
      - name: System zip
        shell: bash
        run: |
          # the x86 loader's AppDir, with FEX-Emu and its i386 root file system
          mkdir x86 && tar -xzf linuxloader_libretro-linux-x86_64.tar.gz -C x86
          mkdir -p dist
          cp -a x86/system dist/
          python3 scripts/fex/fetch-fex.py dist/system/linuxloader
          git rev-parse --short HEAD > dist/system/linuxloader/build
          (cd dist/system/linuxloader && zip -q -r -y -9 "$GITHUB_WORKSPACE/system.zip" .)
      - name: Core
        run: CC=gcc make -f Makefile.libretro SYSTEM_ZIP=system.zip BUILD_STAMP=$(git rev-parse --short HEAD)
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/cores dist/info
          cp build/linuxloader_libretro.so dist/cores/
          strip dist/cores/linuxloader_libretro.so
          cp linuxloader_libretro.info dist/info/
          tar -czf linuxloader_libretro-linux-aarch64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: linuxloader_libretro-linux-aarch64
          path: linuxloader_libretro-linux-aarch64.tar.gz
